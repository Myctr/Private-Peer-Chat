<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Join a Chat | Encrypted Chat</title>
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <main class="app-shell chat-shell">
      <header class="chat-header">
        <a class="back-link" href="index.html">Back</a>
        <h1 class="chat-title">Join a private chat</h1>
        <span></span>
      </header>
      <section class="connection-panel">
        <label class="connection-label" for="receiver-id">Peer ID</label>
        <div class="connection-row">
          <input type="text" id="receiver-id" placeholder="Paste the room ID" autocomplete="off" />
          <button class="primary-button" id="connect-button" type="button">Connect</button>
        </div>
        <div class="status-line"><span id="state">Status</span><span id="status">Waiting to connect</span></div>
      </section>
      <section class="chat-card" aria-label="Chat messages">
        <p class="message-help">Messages are encoded. Click a bubble to reveal its contents.</p>
        <div class="message" id="message"></div>
        <div id="interface">
          <input type="text" id="sendMessageBox" placeholder="Write a message..." autocomplete="off" autofocus />
          <button type="button" id="sendButton">Send</button>
        </div>
      </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/peerjs@1.2.0/dist/peerjs.min.js"></script>
    <script src="send.js"></script>
  </body>
</html>
